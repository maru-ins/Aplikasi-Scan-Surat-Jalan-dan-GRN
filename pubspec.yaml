name: laporan_sj
description: "Aplikasi Laporan Surat Jalan Logistik PT Kabelindo Murni Tbk."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Barcode scanner
  mobile_scanner: ^7.4.0

  # Penyimpanan lokal/offline
  shared_preferences: ^2.5.5

  # Membuat PDF
  pdf: ^3.13.0

  # Akses folder penyimpanan aplikasi
  path_provider: ^2.1.6

  # Preview / print PDF
  printing: ^5.15.0

  # Tanda tangan digital
  signature: ^6.4.0

  # Format tanggal
  intl: ^0.20.3

  # Menyimpan file ke folder public Download Android
  public_file_saver: ^1.1.0
  google_mlkit_text_recognition: 0.16.0
  image_picker: 1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generator ikon aplikasi
  flutter_launcher_icons: ^0.14.4

# ==========================================
# KONFIGURASI IKON APLIKASI
# ==========================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

# ==========================================
# KONFIGURASI FLUTTER
# ==========================================
flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png